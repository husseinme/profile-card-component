<!DOCTYPE html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#333333">

  <!-- iOS fullscreen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My App">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <title>Profile Card App</title>
</head>
<body>
  <main>
    <section class="profile-info">
      <section class="img-section">
        <img src="images/image-victor.jpg" alt="man wearing green jacket and white t-shirt" class="profile-img">
      </section>
      <h1>Victor Crest <span class="age-text">26</span></h1>
      <h2>London</h2>
      <section class="stats-section">
        <section class="stat">
          <h3>80K</h3>
          <h4>Followers</h4>
        </section>
        <section class="stat">
          <h3>803K</h3>
          <h4>Likes</h4>
        </section>
        <section class="last-stat">
          <h3>1.4K</h3>
          <h4>Photos</h4>
        </section>
      </section>
    </section>
  </main>
</body>
</html>
